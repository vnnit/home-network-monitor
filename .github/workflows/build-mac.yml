name: Build Mac M1 (Apple Silicon) App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14 # macOS 14 runs natively on Apple Silicon (M1 / ARM64)

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pywebview

    - name: Build macOS .app with PyInstaller
      run: |
        pyinstaller --noconfirm --onedir --windowed \
          --name "HomeNetworkMonitor" \
          --add-data "index.html:." \
          --add-data "devices.json:." \
          app.py

    - name: Create macOS DMG Installer
      run: |
        mkdir -p dist/dmg_staging
        cp -R "dist/HomeNetworkMonitor.app" "dist/dmg_staging/"
        ln -s /Applications "dist/dmg_staging/Applications"
        hdiutil create -volname "Home Network Monitor" -srcfolder "dist/dmg_staging" -ov -format UDZO "dist/HomeNetworkMonitor-macOS-AppleSilicon.dmg"
        cd dist
        ditto -c -k --sequesterRsrc --keepParent "HomeNetworkMonitor.app" "HomeNetworkMonitor-macOS-AppleSilicon.zip"

    - name: Upload DMG Artifact (Mac M1)
      uses: actions/upload-artifact@v4
      with:
        name: HomeNetworkMonitor-DMG
        path: dist/HomeNetworkMonitor-macOS-AppleSilicon.dmg
        retention-days: 14

    - name: Upload ZIP Artifact (Mac M1)
      uses: actions/upload-artifact@v4
      with:
        name: HomeNetworkMonitor-ZIP
        path: dist/HomeNetworkMonitor-macOS-AppleSilicon.zip
        retention-days: 14
